<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the canvas reaches under notches; safe-area insets
         are applied to the chrome in CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070c" />
    <meta name="description" content="Mine, build and hold one reactor core against an endless hive." />
    <!-- iOS standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SWARM" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <title>SWARM — Hold the Line</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128028;</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <!-- Experimental portrait layout — gate flipped in main.ts. -->
      <div id="rotate">
        <div class="phone"></div>
        <div class="msg" id="rotate-msg">Rotate your device</div>
        <div class="sub" id="rotate-sub">SWARM is played in portrait</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
